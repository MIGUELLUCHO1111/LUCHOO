# Configuración de NGINX para Fullpetro (frontend + backend en subdominios
# separados). Copiar a /etc/nginx/sites-available/fullpetro y enlazar:
#   sudo ln -s /etc/nginx/sites-available/fullpetro /etc/nginx/sites-enabled/
#
# POR QUÉ DOS SUBDOMINIOS (no uno solo con rutas):
# El frontend pide "GET /" (la página) y el backend escucha "POST /" (el
# dispatcher) en la MISMA ruta raíz -- exactamente igual que en desarrollo,
# donde viven en puertos distintos (5173 y 3000). Mezclarlos bajo un solo
# dominio requeriría enrutar por método HTTP dentro de NGINX (frágil). Dos
# subdominios evita el problema por completo y no requiere tocar código.
#
# Reemplazar "tudominio.com" por el dominio real antes de usar este archivo.

# ---------- Frontend (build estático de Vite) ----------
server {
    listen 80;
    server_name app.tudominio.com;

    root /var/www/fullpetro/frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}

# ---------- Backend (API: dispatcher, /user, /fuel, /tracker) ----------
server {
    listen 80;
    server_name api.tudominio.com;

    # Fotos/PDFs subidos pueden ser hasta 10MB (ver multer en el backend).
    client_max_body_size 12M;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Después de certbot (ver DEPLOYMENT.md), certbot agrega automáticamente los
# bloques "listen 443 ssl" y el redirect 80->443 a los dos server{} de arriba.

allowBuilds:
  bcrypt: true
verifyDepsBeforeRun: false
# Seguridad (08/10/2026): versiones corregidas de librerías que vienen DENTRO
# de otras (pnpm audit). proxy-addr (crítica) y qs vienen con Express;
# ip-address con express-rate-limit; uuid y brace-expansion con exceljs.
# Se mantiene la versión mayor que espera cada librería.
overrides:
  proxy-addr: ^2.0.8
  qs: ^6.16.0
  ip-address: ^10.7.1
  "uuid@<11.1.1": ^11.1.1
  "brace-expansion@1": ^1.1.21
  "brace-expansion@2": ^2.1.7

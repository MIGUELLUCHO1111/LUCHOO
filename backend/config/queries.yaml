    query: 'INSERT INTO public.tracker_daily_analysis (fecha, unidades_consultadas, total_viajes, viajes_diurnos, viajes_nocturnos, viajes_mixtos, top_distancia, top_ralenti, eventos_totales, top_excesos_velocidad, eventos_por_tipo, errores) VALUES ($1, $2, $3, $4, $5, $6, $7::jsonb, $8::jsonb, $9, $10::jsonb, $11::jsonb, $12::jsonb) ON CONFLICT (fecha) DO UPDATE SET unidades_consultadas = EXCLUDED.unidades_consultadas, total_viajes = EXCLUDED.total_viajes, viajes_diurnos = EXCLUDED.viajes_diurnos, viajes_nocturnos = EXCLUDED.viajes_nocturnos, viajes_mixtos = EXCLUDED.viajes_mixtos, top_distancia = EXCLUDED.top_distancia, top_ralenti = EXCLUDED.top_ralenti, eventos_totales = EXCLUDED.eventos_totales, top_excesos_velocidad = EXCLUDED.top_excesos_velocidad, eventos_por_tipo = EXCLUDED.eventos_por_tipo, errores = EXCLUDED.errores, generated_at = NOW() RETURNING id, fecha, generated_at;',
